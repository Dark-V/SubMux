services:
  submux:
    build: .
    image: ghcr.io/dark-v/submux:latest
    container_name: submux
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # Strongly recommended: replace this before first start.
      ADMIN_TOKEN: "change-me-now"
      # COOKIE_SECURE: "1" # enable when the panel is served over HTTPS
    volumes:
      - submux-data:/data

volumes:
  submux-data:
