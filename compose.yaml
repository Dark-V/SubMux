services:
  submux:
    image: ghcr.io/dark-v/submux:latest
    pull_policy: always
    container_name: submux
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # Empty => SubMux generates a persistent token in /data/admin_token
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-auto}"
      # Persistent upstream/bundle cache TTL. Default: 30 minutes.
      CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-1800}"
    volumes:
      - submux-data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  submux-data:
