name: Bootstrap SubMux

on:
  push:
    branches: [main]
    paths:
      - bootstrap.b64
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand project
        shell: bash
        run: |
          set -euo pipefail
          base64 -d bootstrap.b64 > /tmp/submux.tar.gz
          tar -xzf /tmp/submux.tar.gz -C .
          rm -f bootstrap.b64 .github/workflows/bootstrap.yml
      - name: Commit project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add complete SubMux source"
          git push
