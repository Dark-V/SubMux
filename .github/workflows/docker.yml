name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke-test container and API
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/submux-mock
          printf 'vless://one\n' | base64 -w0 > /tmp/submux-mock/one.txt
          printf 'vless://two\n' | base64 -w0 > /tmp/submux-mock/two.txt
          python3 -m http.server 19090 --bind 0.0.0.0 --directory /tmp/submux-mock >/tmp/submux-mock.log 2>&1 &
          MOCK_PID=$!

          cleanup() {
            docker logs submux-smoke 2>/dev/null || true
            docker rm -f submux-smoke >/dev/null 2>&1 || true
            docker volume rm submux-smoke-data >/dev/null 2>&1 || true
            kill "$MOCK_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker build -t submux:smoke .
          docker volume create submux-smoke-data >/dev/null
          docker run -d --name submux-smoke \
            --add-host=host.docker.internal:host-gateway \
            -p 18080:8080 \
            -e ADMIN_TOKEN=smoke-admin \
            -v submux-smoke-data:/data \
            submux:smoke >/dev/null

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:18080/healthz | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:18080/login | grep -q 'SubMux'

          curl -fsS -c /tmp/submux-cookies -o /dev/null \
            -X POST -d 'admin_token=smoke-admin' \
            http://127.0.0.1:18080/login

          curl -fsS -b /tmp/submux-cookies -H 'Content-Type: application/json' \
            -d '{"name":"one","url":"http://host.docker.internal:19090/one.txt","user_agent":"smoke","hwid":"hwid-one","format":"auto","enabled":true}' \
            http://127.0.0.1:18080/api/subscriptions >/dev/null

          curl -fsS -b /tmp/submux-cookies -H 'Content-Type: application/json' \
            -d '{"name":"two","url":"http://host.docker.internal:19090/two.txt","user_agent":"smoke","hwid":"hwid-two","format":"auto","enabled":true}' \
            http://127.0.0.1:18080/api/subscriptions >/dev/null

          TOKEN=$(curl -fsS -b /tmp/submux-cookies -H 'Content-Type: application/json' \
            -d '{"label":"all","scope_all":true,"subscription_ids":[]}' \
            http://127.0.0.1:18080/api/tokens | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')

          curl -fsS "http://127.0.0.1:18080/$TOKEN/" | base64 -d > /tmp/submux-merged.txt
          grep -qx 'vless://one' /tmp/submux-merged.txt
          grep -qx 'vless://two' /tmp/submux-merged.txt

          SCOPED=$(curl -fsS -b /tmp/submux-cookies -H 'Content-Type: application/json' \
            -d '{"label":"one-only","scope_all":false,"subscription_ids":[1]}' \
            http://127.0.0.1:18080/api/tokens | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')

          curl -fsS "http://127.0.0.1:18080/$SCOPED/" | base64 -d > /tmp/submux-scoped.txt
          grep -qx 'vless://one' /tmp/submux-scoped.txt
          if grep -q 'vless://two' /tmp/submux-scoped.txt; then
            echo "Scoped token leaked subscription two" >&2
            exit 1
          fi

          curl -fsS "http://127.0.0.1:18080/sub/one?token=$SCOPED" | base64 -d | grep -qx 'vless://one'

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dark-v/submux
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
