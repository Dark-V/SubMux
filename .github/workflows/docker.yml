name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke-test container and API
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/submux-mock
          printf 'vless://user-a@dup.example:443?security=reality&type=tcp&sni=example.com#A\nvless://user-one@one.example:443?security=reality&type=tcp#one\n' | base64 -w0 > /tmp/submux-mock/one.txt
          printf 'vless://user-b@dup.example:443?type=tcp&sni=example.com&security=reality#B\nvless://user-two@two.example:443?security=reality&type=tcp#two\n' | base64 -w0 > /tmp/submux-mock/two.txt
          python3 -m http.server 19090 --bind 0.0.0.0 --directory /tmp/submux-mock >/tmp/submux-mock.log 2>&1 &
          MOCK_PID=$!

          cleanup() {
            docker logs submux-smoke 2>/dev/null || true
            docker rm -f submux-smoke >/dev/null 2>&1 || true
            docker volume rm submux-smoke-data >/dev/null 2>&1 || true
            kill "$MOCK_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker build -t submux:smoke .
          docker volume create submux-smoke-data >/dev/null
          docker run -d --name submux-smoke \
            --add-host=host.docker.internal:host-gateway \
            -p 18081:8080 \
            -p 18082:8081 \
            -e ADMIN_TOKEN=smoke-admin \
            -v submux-smoke-data:/data \
            submux:smoke >/dev/null

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:18081/healthz | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:18081/login | grep -q 'SubMux'

          # Public listener must never expose the admin surface.
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18082/admin)" = "404"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18082/login)" = "404"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18082/api/subscriptions)" = "404"

          curl -fsS -c /tmp/submux-cookies -o /dev/null \
            -X POST -d 'admin_token=smoke-admin' \
            http://127.0.0.1:18081/login

          curl -fsS -b /tmp/submux-cookies -H 'Content-Type: application/json' \
            -d '{"name":"one","url":"http://host.docker.internal:19090/one.txt","user_agent":"smoke","hwid":"hwid-one","format":"auto","enabled":true}' \
            http://127.0.0.1:18081/api/subscriptions >/dev/null

          curl -fsS -b /tmp/submux-cookies -H 'Content-Type: application/json' \
            -d '{"name":"two","url":"http://host.docker.internal:19090/two.txt","user_agent":"smoke","hwid":"hwid-two","format":"auto","enabled":true}' \
            http://127.0.0.1:18081/api/subscriptions >/dev/null

          TOKEN=$(curl -fsS -b /tmp/submux-cookies -H 'Content-Type: application/json' \
            -d '{"label":"all","scope_all":true,"subscription_ids":[]}' \
            http://127.0.0.1:18081/api/tokens | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')

          # Admin listener must never serve public token routes.
          test "$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:18081/$TOKEN/")" = "404"

          curl -fsS -D /tmp/submux-h1 "http://127.0.0.1:18082/$TOKEN/" -o /tmp/submux-body1
          grep -qi '^x-submux-cache: REFRESH' /tmp/submux-h1
          base64 -d /tmp/submux-body1 > /tmp/submux-merged.txt
          grep -q 'user-one@one.example:443' /tmp/submux-merged.txt
          grep -q 'user-two@two.example:443' /tmp/submux-merged.txt
          test "$(grep -c 'dup.example:443' /tmp/submux-merged.txt)" -eq 1
          grep -q 'user-a@dup.example:443' /tmp/submux-merged.txt
          if grep -q 'user-b@dup.example:443' /tmp/submux-merged.txt; then
            echo "Semantic duplicate was not removed" >&2
            exit 1
          fi

          # Second request must be served from persistent bundle cache.
          curl -fsS -D /tmp/submux-h2 "http://127.0.0.1:18082/$TOKEN/" -o /tmp/submux-body2
          grep -qi '^x-submux-cache: HIT' /tmp/submux-h2
          cmp /tmp/submux-body1 /tmp/submux-body2

          # forceUpdate must rebuild the selected bundle immediately.
          curl -fsS -D /tmp/submux-h3 "http://127.0.0.1:18082/$TOKEN/?forceUpdate=1" -o /tmp/submux-body3
          grep -qi '^x-submux-cache: REFRESH' /tmp/submux-h3
          cmp /tmp/submux-body1 /tmp/submux-body3

          SCOPED=$(curl -fsS -b /tmp/submux-cookies -H 'Content-Type: application/json' \
            -d '{"label":"one-only","scope_all":false,"subscription_ids":[1]}' \
            http://127.0.0.1:18081/api/tokens | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')

          curl -fsS "http://127.0.0.1:18082/$SCOPED/" | base64 -d > /tmp/submux-scoped.txt
          grep -q 'user-one@one.example:443' /tmp/submux-scoped.txt
          grep -q 'user-a@dup.example:443' /tmp/submux-scoped.txt
          if grep -q 'user-two@two.example:443' /tmp/submux-scoped.txt; then
            echo "Scoped token leaked subscription two" >&2
            exit 1
          fi

          curl -fsS "http://127.0.0.1:18082/sub/one?token=$SCOPED" | base64 -d | grep -q 'user-one@one.example:443'

          # Admin RAW inspector must return the upstream body byte-for-byte.
          curl -fsS -b /tmp/submux-cookies \
            http://127.0.0.1:18081/api/subscriptions/1/raw > /tmp/submux-raw.txt
          cmp /tmp/submux-mock/one.txt /tmp/submux-raw.txt

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dark-v/submux
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
